<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Federated Learning Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0B0E14;
            color: #F8FAFC;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: #94A3B8;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        button {
            background: #1E293B;
            color: #F8FAFC;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
        }

        button:hover {
            background: #2D3B4E;
            border-color: #475569;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: #38BDF8;
            color: #0B0E14;
            border-color: #38BDF8;
        }

        button.primary:hover {
            background: #0EA5E9;
            border-color: #0EA5E9;
        }

        button.danger {
            background: #EF4444;
            color: #F8FAFC;
            border-color: #EF4444;
        }

        button.danger:hover {
            background: #DC2626;
            border-color: #DC2626;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748B;
        }

        .status-dot.connected {
            background: #22C55E;
            box-shadow: 0 0 8px #22C55E80;
        }

        .status-dot.error {
            background: #EF4444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: #111827;
            border: 1px solid #1E293B;
            border-radius: 12px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .node-id {
            font-size: 12px;
            color: #38BDF8;
            font-weight: 600;
            background: #38BDF820;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .metrics {
            display: grid;
            gap: 12px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            color: #94A3B8;
            font-size: 13px;
        }

        .metric-value {
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .log-container {
            background: #111827;
            border: 1px solid #1E293B;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .log-content {
            background: #0B0E14;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 4px;
            color: #94A3B8;
        }

        .log-entry.error {
            color: #EF4444;
        }

        .log-entry.success {
            color: #22C55E;
        }

        .log-timestamp {
            color: #64748B;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748B;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0B0E14;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ESP32-S3 Federated Learning Dashboard</h1>
            <p class="subtitle">Real-time telemetry from mesh network nodes</p>
        </header>

        <div class="header-actions">
            <a href="/flasher.html" style="text-decoration: none;">
                <button class="primary">🔌 Flash Firmware</button>
            </a>
        </div>

        <div class="controls">
            <button id="connectBtn" class="primary">Connect ESP32</button>
            <button id="disconnectBtn" class="danger" disabled>Disconnect</button>
            <div class="status">
                <span class="status-dot" id="serialDot"></span>
                <span id="serialStatus">Not connected</span>
            </div>
            <div class="status">
                <span class="status-dot" id="wsDot"></span>
                <span id="wsStatus">Connecting...</span>
            </div>
        </div>

        <div class="grid" id="nodeGrid">
            <div class="empty-state">
                <div class="empty-state-icon">📡</div>
                <p>No nodes detected yet</p>
                <p style="font-size: 13px; margin-top: 8px;">Connect your ESP32 to start receiving telemetry</p>
            </div>
        </div>

        <div class="log-container">
            <div class="log-header">
                <h2 class="card-title">Activity Log</h2>
                <button onclick="clearLog()">Clear</button>
            </div>
            <div class="log-content" id="logContent"></div>
        </div>
    </div>

    <script>
        let serialPort = null;
        let reader = null;
        let ws = null;
        let nodes = new Map();

        // WebSocket connection to relay server (same port, upgrade to WebSocket)
        const wsUrl = `wss://${window.location.hostname}/ws`;
        
        function connectWebSocket() {
            log('Connecting to relay server...');
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                log('Connected to relay server', 'success');
                updateWSStatus(true);
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'telemetry') {
                        updateNode(data);
                    }
                } catch (e) {
                    console.error('Error parsing WebSocket message:', e);
                }
            };
            
            ws.onerror = (error) => {
                log('WebSocket error', 'error');
                updateWSStatus(false);
            };
            
            ws.onclose = () => {
                log('Disconnected from relay server', 'error');
                updateWSStatus(false);
                setTimeout(connectWebSocket, 3000);
            };
        }

        async function connectSerial() {
            try {
                serialPort = await navigator.serial.requestPort();
                await serialPort.open({ baudRate: 115200 });
                
                log('Connected to ESP32', 'success');
                updateSerialStatus(true);
                
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                
                readSerial();
            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
            }
        }

        async function disconnectSerial() {
            if (reader) {
                await reader.cancel();
                reader = null;
            }
            if (serialPort) {
                await serialPort.close();
                serialPort = null;
            }
            
            log('Disconnected from ESP32');
            updateSerialStatus(false);
            
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
        }

        async function readSerial() {
            const textDecoder = new TextDecoder();
            reader = serialPort.readable.getReader();
            
            let buffer = '';
            
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += textDecoder.decode(value, { stream: true });
                    
                    let lines = buffer.split('\n');
                    buffer = lines.pop();
                    
                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('{')) {
                            try {
                                const data = JSON.parse(line);
                                data.type = 'telemetry';
                                data.timestamp = Date.now() / 1000;
                                
                                // Update local display
                                updateNode(data);
                                
                                // Broadcast to other clients via WebSocket
                                if (ws && ws.readyState === WebSocket.OPEN) {
                                    ws.send(JSON.stringify(data));
                                }
                            } catch (e) {
                                console.error('JSON parse error:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                log(`Read error: ${error.message}`, 'error');
            } finally {
                reader.releaseLock();
            }
        }

        function updateNode(data) {
            const nodeId = data.node_id;
            nodes.set(nodeId, data);
            renderNodes();
        }

        function renderNodes() {
            const grid = document.getElementById('nodeGrid');
            
            if (nodes.size === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📡</div>
                        <p>No nodes detected yet</p>
                        <p style="font-size: 13px; margin-top: 8px;">Connect your ESP32 to start receiving telemetry</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = '';
            
            for (const [nodeId, data] of nodes) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">Node ${nodeId}</div>
                        <div class="node-id">ID ${nodeId}</div>
                    </div>
                    <div class="metrics">
                        ${data.accuracy !== undefined ? `
                            <div class="metric">
                                <span class="metric-label">Accuracy</span>
                                <span class="metric-value">${(data.accuracy * 100).toFixed(1)}%</span>
                            </div>
                        ` : ''}
                        ${data.loss !== undefined ? `
                            <div class="metric">
                                <span class="metric-label">Loss</span>
                                <span class="metric-value">${data.loss.toFixed(4)}</span>
                            </div>
                        ` : ''}
                        ${data.epoch !== undefined ? `
                            <div class="metric">
                                <span class="metric-label">Epoch</span>
                                <span class="metric-value">${data.epoch}</span>
                            </div>
                        ` : ''}
                        ${data.rssi !== undefined ? `
                            <div class="metric">
                                <span class="metric-label">Signal (RSSI)</span>
                                <span class="metric-value">${data.rssi} dBm</span>
                            </div>
                        ` : ''}
                        ${data.temperature !== undefined ? `
                            <div class="metric">
                                <span class="metric-label">Temperature</span>
                                <span class="metric-value">${data.temperature}°C</span>
                            </div>
                        ` : ''}
                        ${data.heap_free !== undefined ? `
                            <div class="metric">
                                <span class="metric-label">Free Heap</span>
                                <span class="metric-value">${(data.heap_free / 1024).toFixed(1)} KB</span>
                            </div>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function log(message, type = '') {
            const logContent = document.getElementById('logContent');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logContent').innerHTML = '';
        }

        function updateSerialStatus(connected) {
            const dot = document.getElementById('serialDot');
            const status = document.getElementById('serialStatus');
            if (connected) {
                dot.classList.add('connected');
                status.textContent = 'ESP32 connected';
            } else {
                dot.classList.remove('connected');
                status.textContent = 'Not connected';
            }
        }

        function updateWSStatus(connected) {
            const dot = document.getElementById('wsDot');
            const status = document.getElementById('wsStatus');
            if (connected) {
                dot.classList.add('connected');
                status.textContent = 'Relay connected';
            } else {
                dot.classList.remove('connected');
                dot.classList.add('error');
                status.textContent = 'Relay disconnected';
            }
        }

        // Event listeners
        document.getElementById('connectBtn').addEventListener('click', connectSerial);
        document.getElementById('disconnectBtn').addEventListener('click', disconnectSerial);

        // Check Web Serial API support
        if (!('serial' in navigator)) {
            log('Web Serial API not supported in this browser', 'error');
            document.getElementById('connectBtn').disabled = true;
        }

        // Connect WebSocket on load
        connectWebSocket();
    </script>
</body>
</html>
