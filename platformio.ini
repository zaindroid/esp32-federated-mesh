; PlatformIO Project Configuration File for ESP32-S3 Federated Learning

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP-IDF version
platform_packages = 
    platformio/framework-arduinoespressif32 @ ^3.20014.231204

; Serial monitor
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    colorize

; Build flags for optimization
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Ofast
    -funroll-loops
    -ffast-math
    -march=native
    -mtune=native

; Include directories
build_src_filter = 
    +<*>
    +<../include/*>

; Upload configuration
upload_speed = 921600
upload_port = COM3  ; Change this to your port (COM3, COM4, etc.)

; Dependencies
lib_deps = 
    ; ESP-NOW is built into ESP32 Arduino core

; Memory configuration
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_opi

; Advanced optimization
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
